<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>TikTok login</title></head>
<body style="font-family:sans-serif;max-width:40rem;margin:3rem auto;padding:0 1rem">
<h1>Login successful</h1>
<p>Copy this code and paste it into the agent:</p>
<textarea id="c" rows="4" style="width:100%" readonly></textarea>
<script>
  var p = new URLSearchParams(location.search);
  document.getElementById("c").value = p.get("code") || p.get("error_description") || "No code found.";
</script>
</body></html>
